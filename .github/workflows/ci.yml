name: CI

# Runs on every pull request, including stacked PRs that target another
# feature branch rather than main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Validates content, typechecks and builds.
      - run: npm run build
